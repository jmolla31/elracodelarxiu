
baseURL: "https://elracodelarxiu.com"
title: El Racó De l'Arxiu
theme: PaperMod
defaultContentLanguage: ca
languageCode: ca

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: El Racó De l'Arxiu
  description: "El Racó De l'Arxiu"
  keywords: ["arxiu", "història", "música festera", "Unió Artística Musical d'Ontinyent", "Ontinyent"]
  images: ["/images/mainbanner.jpg"] # default share image; posts override it with cover.image
  DateFormat: ":date_long" # localised, e.g. "24 de març de 2026"
  defaultTheme: dark # Force dark mode only
  disableThemeToggle: true

  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false
  hideAuthor: false # posts credit their author via front matter

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "/images/favicon.ico"
    favicon16x16: "/images/favicon.ico"
    favicon32x32: "/images/favicon.ico"

  label:
    text: "Inici"
    icon: /images/favicon.ico
    iconHeight: 35

  # home-info mode
  homeInfoParams:
    Title: "El Racó de l'Arxiu"
    Content: |
      **Més enllà de calaixos, gravacions i partitures.**
      
      El Racó de l'Arxiu té per objectiu conservar, divulgar i apropar els documents i partitures dels que disposem a la Societat Unió Artística al públic. Transmitint les anècdotes, curiositats i orígens de la nostra música.
      
      • **Unió Artística Musical d'Ontinyent** •

  socialIcons:
    - name: tiktok
      url: "https://www.tiktok.com/@uamontinyent"
    - name: instagram
      url: "https://www.instagram.com/uamontinyent"
    - name: youtube
      url: "https://www.youtube.com/@uamontinyent"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  editPost:
    URL: "/suggereix-canvis"
    Text: "Suggereix Canvis" # edit text
    appendFilePath: false # don't append file path since we're using a custom page

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 25
    - identifier: suggereix-canvis
      name: Suggereix Canvis
      url: /suggereix-canvis/
      weight: 28
    - identifier: example
      name: "Unió Artística Musical d'Ontinyent"
      url: https://www.suamontinyent.com/
      params:
        newtab: true
      weight: 30
    - identifier: about
      name: Sobre el projecte
      url: /about/
      weight: 26
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai